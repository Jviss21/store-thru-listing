# Example Cloud Run (v1) service manifest — EDIT before apply.
# Prep only: do not apply until you intend to run on GCP.
#
#   gcloud run services replace deploy/gcp/cloud-run-service.yaml --region=us-central1
#
# Prefer `gcloud run deploy` + Secret Manager for first bring-up; keep this file
# as a documented shape for IaC later.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: store-thru-listing
  labels:
    app: store-thru-listing
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
        # Uncomment if using Cloud SQL Auth Proxy sidecar / VPC:
        # run.googleapis.com/cloudsql-instances: PROJECT:REGION:INSTANCE
        # run.googleapis.com/vpc-access-connector: projects/PROJECT/locations/REGION/connectors/CONNECTOR
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: store-thru-listing-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/stl-docker/store-thru-listing:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_MARKETPLACE_MODE
              value: mock
            # Canonical public URL after domain mapping
            - name: NEXTAUTH_URL
              value: https://YOUR_CANONICAL_HOST
            # Optional GCS (when photo-storage gains a GCS backend)
            - name: GCS_BUCKET
              value: YOUR_PHOTOS_BUCKET
            # Prefer Secret Manager references in real deploys, e.g.:
            # - name: NEXTAUTH_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: NEXTAUTH_SECRET
            #       key: latest
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: DATABASE_URL
            #       key: latest
          startupProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 30
